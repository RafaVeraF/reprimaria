# Blueprint de Render: crea la Reprimaria como sitio estático (gratis, no se duerme).
services:
  - type: web
    name: reprimaria
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
